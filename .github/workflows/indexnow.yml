name: IndexNow (avisar a Bing de paginas nuevas o cambiadas)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Esperar a que GitHub Pages publique
        run: sleep 120
      - name: Enviar URL cambiadas a IndexNow
        env:
          KEY: c02bbcce038efbd0b7c48bc880b98122
          HOST: dracatalinabeltran.com
          # Paginas que no se avisan a IndexNow
          EXCLUDE: "/privacidad/"
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILES=$(git ls-files '*index.html')
          else
            FILES=$(git diff --name-only HEAD~1 HEAD -- '*index.html' || true)
          fi
          URLS=""
          for f in $FILES; do
            [ -f "$f" ] || continue
            p="/${f%index.html}"; [ "$p" = "/" ] || p="${p}"
            case " $EXCLUDE " in *" $p "*) continue;; esac
            u="https://$HOST$p"
            grep -q "<loc>$u</loc>" sitemap.xml || continue
            URLS="$URLS\"$u\","
          done
          if [ -z "$URLS" ]; then echo "Sin paginas cambiadas"; exit 0; fi
          BODY="{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":[${URLS%,}]}"
          echo "$BODY"
          curl -sS -o /dev/stderr -w "HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" -d "$BODY"
